name: WikiTrace CI

on:
  push:
    branches: [main, master, codex/openai-smoke-test]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install test dependencies
        run: uv sync --locked --extra dev --python 3.11

      - name: Run unit tests
        run: uv run pytest -q tests/unit

      - name: Build package
        run: uv build

      - name: Save package artifact
        uses: actions/upload-artifact@v7
        with:
          name: wikitrace-package
          path: dist/*
          retention-days: 7
